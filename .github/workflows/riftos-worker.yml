name: RiftOS Private Build Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact RiftOS branch, tag, or commit to build
        required: true
        default: main
        type: string
      client_id:
        description: Optional Editor/local correlation id copied into private release notes
        required: false
        default: ''
        type: string
      publish:
        description: Return the APK to private RiftOS as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: riftos-private-worker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ''
      CLIENT_ID: ${{ inputs.client_id }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - name: Resolve exact private RiftOS source
        id: source
        env:
          GH_TOKEN: ${{ secrets.RIFTOS_PRIVATE_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'RIFTOS_PRIVATE_TOKEN is required.' >&2; exit 1; }
          SOURCE_SHA="$(gh api "repos/Arctic403/RiftOS/commits/${SOURCE_REF:-main}" --jq '.sha')"
          CLIENT_ID="${CLIENT_ID:-manual-${GITHUB_RUN_ID}}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"

      - name: Check out builder
        uses: actions/checkout@v5
        with:
          path: worker
          persist-credentials: false
          fetch-depth: 1

      - name: Check out RiftOS
        uses: actions/checkout@v5
        with:
          repository: Arctic403/RiftOS
          ref: ${{ steps.source.outputs.source_sha }}
          token: ${{ secrets.RIFTOS_PRIVATE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Restore signing identity
        env:
          RIFTOS_KEYSTORE_B64: ${{ secrets.RIFTOS_KEYSTORE_B64 }}
          RIFTOS_KEYSTORE_PASSWORD: ${{ secrets.RIFTOS_KEYSTORE_PASSWORD }}
          RIFTOS_KEY_ALIAS: ${{ secrets.RIFTOS_KEY_ALIAS }}
          RIFTOS_KEY_PASSWORD: ${{ secrets.RIFTOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for required in RIFTOS_KEYSTORE_B64 RIFTOS_KEYSTORE_PASSWORD RIFTOS_KEY_ALIAS RIFTOS_KEY_PASSWORD; do
            test -n "${!required}" || { echo "Missing signing secret: $required. Refusing fallback signing." >&2; exit 1; }
          done
          printf '%s' "$RIFTOS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/riftos-release.keystore"
          fingerprint="$(keytool -exportcert -keystore "$RUNNER_TEMP/riftos-release.keystore" -storepass:env RIFTOS_KEYSTORE_PASSWORD -alias "$RIFTOS_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          test "$fingerprint" != "4de8926eb4673c00779a645a1cef7c2aec53a83f52d3b79a29a2cc48d4faf4e8" || { echo 'Compromised public signing key rejected.' >&2; exit 1; }
          echo "RIFT_SIGN_STORE=$RUNNER_TEMP/riftos-release.keystore" >> "$GITHUB_ENV"
          echo "RIFT_SIGN_STORE_PASS=$RIFTOS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RIFT_SIGN_ALIAS=$RIFTOS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RIFT_SIGN_KEY_PASS=$RIFTOS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build RiftOS APK
        run: bash worker/scripts/riftos-build.sh source

      - name: Publish APK to private RiftOS prerelease
        if: ${{ success() && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RIFTOS_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="rift-worker-${GITHUB_RUN_ID}-${SHORT_SHA}"
          gh release create "$TAG" "$RUNNER_TEMP/riftos-output/RiftOS-Android-debug.apk" \
            --repo Arctic403/RiftOS \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "RiftOS worker build ${SHORT_SHA}" \
            --notes "RiftOS APK built by Arctic403/Riftos-builder run ${GITHUB_RUN_ID}. Source ${SOURCE_SHA}. Client ${CLIENT_ID}."

      - name: Return private build log
        if: ${{ failure() && env.PUBLISH == 'true' && env.SOURCE_SHA != '' }}
        env:
          GH_TOKEN: ${{ secrets.RIFTOS_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="rift-worker-failed-${GITHUB_RUN_ID}-${SHORT_SHA}"
          mkdir -p "$RUNNER_TEMP/riftos-private-logs"
          printf 'source_sha=%s\nclient_id=%s\nbuilder_run_id=%s\n' "$SOURCE_SHA" "$CLIENT_ID" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/riftos-private-logs/failure-context.txt"
          (cd "$RUNNER_TEMP/riftos-private-logs" && zip -qr "$RUNNER_TEMP/RiftOS-worker-failure-${SHORT_SHA}.zip" .)
          gh release create "$TAG" "$RUNNER_TEMP/RiftOS-worker-failure-${SHORT_SHA}.zip" \
            --repo Arctic403/RiftOS \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "RiftOS worker FAILED ${SHORT_SHA}" \
            --notes "RiftOS build failed in public builder run ${GITHUB_RUN_ID}. Source ${SOURCE_SHA}. Client ${CLIENT_ID}."

      - name: Remove private source
        if: ${{ always() }}
        run: |
          rm -rf source
          rm -f "$RUNNER_TEMP/riftos-release.keystore"
