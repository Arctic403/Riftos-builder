name: Rift Clang Payload Proof

on:
  push:
    paths:
      - '.github/riftclang-arm32.trigger'
  workflow_dispatch:
    inputs:
      host_abi:
        description: Android ABI the compiler itself will run on
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
      publish:
        description: Publish the proven payload as a public prerelease asset
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: riftclang-payload-${{ github.event_name == 'workflow_dispatch' && inputs.host_abi || 'armeabi-v7a' }}
  cancel-in-progress: false

jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HOST_ABI: ${{ github.event_name == 'workflow_dispatch' && inputs.host_abi || 'armeabi-v7a' }}
    steps:
      - name: Check out builder
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate payload script
        run: bash -n scripts/build-riftclang-payload.sh

      - name: Install Android NDK r30
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang lld python3 git file binutils

      - name: Build minimal Android-hosted Clang payload
        env:
          LLVM_VERSION: '23.1.1'
        run: |
          set -euo pipefail
          bash scripts/build-riftclang-payload.sh "$HOST_ABI" "$RUNNER_TEMP/riftclang"

      - name: Record proof summary
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/riftclang/payload.sha256"
          cat "$RUNNER_TEMP/riftclang/payload/manifest.json"
          du -sh "$RUNNER_TEMP/riftclang/payload"
          ls -lh "$RUNNER_TEMP/riftclang/"*.tar.gz

      - name: Publish proven payload
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ABI="$HOST_ABI"
          TAG="riftclang-v1-${ABI}-${GITHUB_RUN_ID}"
          FILE="$RUNNER_TEMP/riftclang/rift-clang-v1-${ABI}.tar.gz"
          SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/riftclang/payload.sha256")"
          gh release create "$TAG" "$FILE"             --repo "${GITHUB_REPOSITORY}"             --prerelease             --title "Rift Clang v1 ${ABI}"             --notes "Experimental RiftOS Semnexis bootstrap payload. LLVM 23.1.1, Android NDK r30, API 26. Payload SHA-256: ${SHA}. Not consumed by the main RiftOS APK worker until separately pinned and verified."
